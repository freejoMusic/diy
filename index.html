<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIY Builds</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <header class="hero">
    <h1>DIY Builds</h1>
    <p>Audio Devices •  Instruments  •  Pedals</p>
  </header>

  <div class="grid">

    <!-- TRACK / PROJECT 1 -->
    <div class="card">
      <h2>SSL 9k Style Preamp</h2>

      <div class="media">
        <video controls poster="thumbs/thumb1.png">
          <source src="media/test.mp4" type="video/mp4">
        </video>
      </div>

      <p class="tag">SSL 9k5 // Carnhill Trafo and Switching Combo Input...</p>
    </div>

    <!-- PROJECT 2 -->
    <div class="card">
      <h2>La3a Style Opto Compressor</h2>

      <div class="media">
        <video controls poster="thumb2.jpg">
          <source src="test2.mov" type="video/mp4">
        </video>
      </div>

      <p class="tag">GAP 3A Rebuild // Kenetek and Cinemag Upgrades...</p>
    </div>

    <!-- PROJECT 3 -->
    <div class="card">
      <h2>Ambient Soundscape</h2>

      <div class="media">
        <video controls poster="thumb3.jpg">
          <source src="video3.mp4" type="video/mp4">
        </video>
      </div>

      <p class="tag">Ambient / Cinematic</p>
    </div>

  </div>

</div>

</body>
